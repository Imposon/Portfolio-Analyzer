app = "portfolio-analyzer"
primary_region = "bom"

[build]
  builder = "heroku/buildpacks:20"

[env]
  NPM_CONFIG_PRODUCTION = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[statics]]
  guest_path = "/app/dist"
  url_prefix = "/"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
