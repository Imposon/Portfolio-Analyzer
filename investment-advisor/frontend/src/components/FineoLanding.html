<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINEO - A new era of personal finance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --accent-gold: #ffd700;
            --accent-green: #22c55e;
            --btn-bg: rgba(255, 255, 255, 0.1);
            --btn-hover: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Noise Texture Overlay */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(10, 10, 10, 0.8), transparent);
            backdrop-filter: blur(20px);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 0%, rgba(255,255,255,0.8) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 400;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }

        .nav-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn-login {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
            background: none;
            border: none;
            cursor: pointer;
        }

        .btn-login:hover {
            color: var(--text-primary);
        }

        .btn-signup {
            background: var(--text-primary);
            color: var(--bg-primary);
            padding: 0.75rem 1.5rem;
            border-radius: 999px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-signup:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 40px rgba(255, 255, 255, 0.2);
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 0 2rem;
        }

        .hero-content {
            text-align: center;
            max-width: 900px;
            z-index: 10;
            position: relative;
        }

        .hero-headline {
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease forwards;
        }

        .hero-subtext {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto 2.5rem;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease 0.2s forwards;
        }

        .btn-waitlist {
            background: var(--btn-bg);
            color: var(--text-primary);
            padding: 1rem 2.5rem;
            border-radius: 999px;
            font-size: 1rem;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease 0.4s forwards;
        }

        .btn-waitlist:hover {
            background: var(--btn-hover);
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.1);
        }

        /* 3D Floating Coin */
        .coin-container {
            position: absolute;
            right: 10%;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
        }

        .coin {
            width: 200px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            animation: float 6s ease-in-out infinite;
        }

        .coin-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4a 50%, #ffd700 100%);
            box-shadow: 
                0 0 60px rgba(255, 215, 0, 0.5),
                0 0 100px rgba(255, 215, 0, 0.3),
                inset 0 -10px 20px rgba(0, 0, 0, 0.2);
        }

        .coin-face::before {
            content: '₹';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            font-weight: 700;
            color: rgba(0, 0, 0, 0.3);
        }

        .coin-edge {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(90deg, #b8860b, #ffd700, #b8860b);
            transform: translateZ(-10px);
        }

        /* Metallic Wave */
        .wave-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40%;
            z-index: 1;
            overflow: hidden;
        }

        .wave {
            position: absolute;
            bottom: -50%;
            left: -10%;
            right: -10%;
            height: 100%;
            background: linear-gradient(180deg, 
                transparent 0%,
                rgba(192, 192, 192, 0.1) 20%,
                rgba(192, 192, 192, 0.2) 40%,
                rgba(169, 169, 169, 0.3) 60%,
                rgba(128, 128, 128, 0.2) 100%
            );
            border-radius: 50% 50% 0 0;
            animation: wave 10s ease-in-out infinite;
            filter: blur(1px);
        }

        .wave::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, 
                transparent,
                rgba(255, 255, 255, 0.1),
                transparent
            );
            animation: shimmer 3s ease-in-out infinite;
        }

        /* Scroll Indicator */
        .scroll-indicator {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            opacity: 0;
            animation: fadeIn 1s ease 1s forwards;
        }

        .scroll-text {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .scroll-arrow {
            width: 24px;
            height: 24px;
            border: 2px solid var(--text-secondary);
            border-top: none;
            border-left: none;
            transform: rotate(45deg);
            animation: bounce 2s ease-in-out infinite;
        }

        /* Animations */
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotateY(0deg);
            }
            50% {
                transform: translateY(-30px) rotateY(10deg);
            }
        }

        @keyframes wave {
            0%, 100% {
                transform: translateY(0) scaleX(1);
            }
            50% {
                transform: translateY(-20px) scaleX(1.1);
            }
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0) rotate(45deg);
            }
            40% {
                transform: translateY(-10px) rotate(45deg);
            }
            60% {
                transform: translateY(-5px) rotate(45deg);
            }
        }

        /* Background Gradient Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(79, 142, 247, 0.3), transparent);
            top: 20%;
            left: 10%;
            animation: orbFloat 20s ease-in-out infinite;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(155, 89, 245, 0.2), transparent);
            bottom: 30%;
            right: 20%;
            animation: orbFloat 15s ease-in-out infinite reverse;
        }

        @keyframes orbFloat {
            0%, 100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(30px, -30px);
            }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .coin-container {
                right: 5%;
                top: 30%;
            }
            
            .coin {
                width: 150px;
                height: 150px;
            }
            
            .coin-face::before {
                font-size: 3.5rem;
            }
        }

        @media (max-width: 768px) {
            nav {
                padding: 1rem 1.5rem;
            }
            
            .nav-links {
                display: none;
            }
            
            .hero {
                padding: 6rem 1.5rem 2rem;
            }
            
            .coin-container {
                display: none;
            }
            
            .wave-container {
                height: 25%;
            }
            
            .hero-headline {
                font-size: 2.5rem;
            }
        }

        /* Mobile Menu Toggle */
        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0.5rem;
        }

        .menu-toggle span {
            width: 24px;
            height: 2px;
            background: var(--text-primary);
            transition: all 0.3s ease;
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: flex;
            }
        }
    </style>
</head>
<body>
    <div class="noise-overlay"></div>

    <!-- Navigation -->
    <nav>
        <div class="logo">FINEO</div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#personal">Personal</a></li>
            <li><a href="#business">Business</a></li>
        </ul>
        <div class="nav-actions">
            <button class="btn-login">Log in</button>
            <button class="btn-signup">Sign up</button>
        </div>
        <button class="menu-toggle" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </nav>

    <!-- Hero Section -->
    <section class="hero" id="home">
        <!-- Background Orbs -->
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>

        <!-- 3D Floating Coin -->
        <div class="coin-container">
            <div class="coin">
                <div class="coin-face"></div>
                <div class="coin-edge"></div>
            </div>
        </div>

        <!-- Hero Content -->
        <div class="hero-content">
            <h1 class="hero-headline">A new era of<br>personal finance</h1>
            <p class="hero-subtext">The world's most advanced digital clinic to help you live longer, prevent disease, and feel your best</p>
            <button class="btn-waitlist">Join waitlist</button>
        </div>

        <!-- Metallic Wave -->
        <div class="wave-container">
            <div class="wave"></div>
        </div>

        <!-- Scroll Indicator -->
        <div class="scroll-indicator">
            <span class="scroll-text">Scroll</span>
            <div class="scroll-arrow"></div>
        </div>
    </section>

    <script>
        // Smooth scroll for navigation
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });

        // Parallax effect on mouse move
        document.addEventListener('mousemove', (e) => {
            const mouseX = e.clientX / window.innerWidth - 0.5;
            const mouseY = e.clientY / window.innerHeight - 0.5;

            const coin = document.querySelector('.coin');
            const orbs = document.querySelectorAll('.orb');

            if (coin) {
                coin.style.transform = `perspective(1000px) rotateY(${mouseX * 20}deg) rotateX(${-mouseY * 20}deg)`;
            }

            orbs.forEach((orb, index) => {
                const speed = (index + 1) * 20;
                orb.style.transform = `translate(${mouseX * speed}px, ${mouseY * speed}px)`;
            });
        });

        // Button click handlers
        document.querySelector('.btn-waitlist').addEventListener('click', () => {
            alert('Thanks for your interest! The waitlist will open soon.');
        });

        document.querySelector('.btn-signup').addEventListener('click', () => {
            alert('Sign up coming soon!');
        });

        document.querySelector('.btn-login').addEventListener('click', () => {
            alert('Login coming soon!');
        });

        // Mobile menu toggle
        const menuToggle = document.querySelector('.menu-toggle');
        const navLinks = document.querySelector('.nav-links');

        menuToggle.addEventListener('click', () => {
            navLinks.style.display = navLinks.style.display === 'flex' ? 'none' : 'flex';
        });
    </script>
</body>
</html>
